<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      /* Soft pastel lilac-rose gradient directly replicating the reference */
      background: linear-gradient(165deg, #F3EEFE 0%, #E9DEFF 40%, #DBCBFE 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 70px 0 70px;
      color: #3730A3;
    }

    /* Playful neo-brutalist sparkle stars */
    .sparkle {
      position: absolute;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      opacity: 0.55;
      user-select: none;
      z-index: 2;
    }
    .s-1 { top: 70px; left: 560px; font-size: 48px; color: #7C3AED; }
    .s-2 { top: 420px; right: 60px; font-size: 42px; color: #4F46E5; }
    .s-3 { top: 520px; left: 50px; font-size: 44px; color: #DB2777; }
    .s-4 { top: 780px; right: 50px; font-size: 48px; color: #F59E0B; }

    /* Hanging Neo-Brutalist 3D Camera on Rope (Top Right) */
    .hanging-camera-asset {
      position: absolute;
      top: -15px;
      right: 35px;
      width: 460px;
      z-index: 25;
      pointer-events: none;
      filter: drop-shadow(0 25px 35px rgba(55, 48, 163, 0.22));
      transform: rotate(2.5deg);
    }

    /* Top Iconic 3-Word Manifesto (Plan. Grow. Flow. style) */
    .hero-header {
      width: 100%;
      text-align: left;
      padding-left: 20px;
      margin-bottom: 30px;
      z-index: 10;
    }

    .manifesto-words {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 112px;
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -4px;
      color: #3730A3;
      display: flex;
      flex-direction: column;
    }

    .word-1 { color: #312E81; }
    .word-2 { color: #4338CA; }
    .word-3 { color: #4F46E5; }

    /* Phone Showcase Area */
    .showcase-area {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Distinct Dynamic Rotation (~6.5deg like Card 1 reference) */
    .phone-mockup-tilted {
      position: absolute;
      width: 780px;
      height: 1560px;
      bottom: -160px;
      left: 110px;
      background: #09090B;
      border: 8px solid #1E1B4B;
      border-radius: 72px;
      box-shadow: 
        0 40px 90px -15px rgba(55, 48, 163, 0.45),
        16px 22px 0px #1E1B4B;
      padding: 20px;
      transform: rotate(6.5deg);
      z-index: 5;
      overflow: hidden;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 54px;
      overflow: hidden;
      background: #FFFDF6;
      position: relative;
    }

    .screen-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* Stacked Pill Text Badges on Bottom Right (like "Grow / every / day.") */
    .stacked-pills-badge {
      position: absolute;
      bottom: 140px;
      right: 35px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 25;
      align-items: flex-end;
    }

    .pill-item {
      background: #4338CA;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 38px;
      font-weight: 900;
      padding: 10px 30px;
      border-radius: 22px;
      border: 4px solid #1E1B4B;
      box-shadow: 5px 6px 0px #1E1B4B;
      letter-spacing: -1px;
      line-height: 1;
    }

    .pill-item-yellow {
      background: #FACC15;
      color: #1E1B4B;
    }

    /* Artistic Neo-Brutalist Mascot Badge on Bottom Left (like reference orange figure) */
    .artistic-badge-left {
      position: absolute;
      bottom: 80px;
      left: 30px;
      background: #FB923C;
      border: 4.5px solid #1E1B4B;
      border-radius: 34px;
      padding: 20px 24px;
      box-shadow: 8px 10px 0px #1E1B4B;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transform: rotate(-6deg);
    }

    .mascot-icon {
      width: 86px;
      height: 86px;
      background: #FFFFFF;
      border: 3.5px solid #1E1B4B;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 4px 4px 0px #1E1B4B;
    }

    .mascot-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: #1E1B4B;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.1;
    }

    .mascot-sub {
      font-size: 16px;
      font-weight: 800;
      color: #7C2D12;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Playful sparkle accents -->
  <div class="sparkle s-1">✦</div>
  <div class="sparkle s-2">★</div>
  <div class="sparkle s-3">✦</div>
  <div class="sparkle s-4">★</div>

  <!-- Hanging 3D Camera tied to rope (Top Right) -->
  <img src="hanging_camera_clean.png" class="hanging-camera-asset" alt="PicsTools 3D Camera">

  <!-- Top 3-Word Manifesto -->
  <div class="hero-header">
    <div class="manifesto-words">
      <span class="word-1">Create.</span>
      <span class="word-2">Edit.</span>
      <span class="word-3">Transform.</span>
    </div>
  </div>

  <!-- Showcase Area -->
  <div class="showcase-area">
    <!-- Distinct Angled Phone Mockup (6.5deg tilt) -->
    <div class="phone-mockup-tilted">
      <div class="phone-screen">
        <img src="user_home_screen_clean.png" class="screen-img" alt="PicsTools App Home Screen">
      </div>
    </div>

    <!-- Artistic Sticker Mascot on Bottom Left (like reference) -->
    <div class="artistic-badge-left">
      <div class="mascot-icon">🔒</div>
      <div>
        <div class="mascot-label">100% Offline</div>
        <div class="mascot-sub">Zero Server Uploads</div>
      </div>
    </div>

    <!-- Stacked Badges on Bottom Right (like "Grow every day.") -->
    <div class="stacked-pills-badge">
      <div class="pill-item">8 Essential</div>
      <div class="pill-item">Photo Tools</div>
      <div class="pill-item pill-item-yellow">In One App.</div>
    </div>
  </div>

</body>
</html>
