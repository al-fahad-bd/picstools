<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PicsTools Feature Graphic - Google Play Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 45%, #FAF5FF 100%);
      font-family: 'Inter', -apple-system, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44px;
      color: #0F172A;
    }

    /* Neo-brutalist subtle polka micro-dot pattern */
    .bg-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#94A3B8 1.4px, transparent 1.4px);
      background-size: 24px 24px;
      opacity: 0.28;
      z-index: 1;
      pointer-events: none;
    }

    /* Ambient Pastel Studio Glows */
    .glow-cyan {
      position: absolute;
      width: 450px;
      height: 450px;
      top: -120px;
      left: -80px;
      background: radial-gradient(circle, rgba(165, 243, 252, 0.45) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(55px);
      z-index: 1;
    }
    .glow-lavender {
      position: absolute;
      width: 500px;
      height: 500px;
      bottom: -150px;
      right: 80px;
      background: radial-gradient(circle, rgba(221, 214, 254, 0.5) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(65px);
      z-index: 1;
    }
    .glow-amber {
      position: absolute;
      width: 320px;
      height: 320px;
      top: -60px;
      right: -40px;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(45px);
      z-index: 1;
    }

    /* Sparkle Star Accents */
    .sparkle {
      position: absolute;
      font-size: 20px;
      font-weight: 800;
      user-select: none;
      z-index: 3;
    }
    .sp-1 { top: 26px; left: 390px; color: #F59E0B; transform: rotate(15deg); font-size: 24px; }
    .sp-2 { bottom: 30px; left: 450px; color: #8B5CF6; transform: rotate(-12deg); font-size: 22px; }

    /* LEFT CONTENT: BRANDING & FEATURES */
    .content-left {
      position: relative;
      z-index: 10;
      max-width: 470px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Top Studio Badge */
    .creator-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 2.5px solid #0F172A;
      box-shadow: 3px 3px 0px #0F172A;
      border-radius: 999px;
      padding: 5px 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #0F172A;
      margin-bottom: 14px;
      width: fit-content;
    }
    .creator-pill .live-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      border: 1.5px solid #0F172A;
    }
    .creator-pill .divider {
      color: #94A3B8;
    }

    /* Brand Header Row */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .app-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      border: 3px solid #0F172A;
      box-shadow: 4px 4px 0px #0F172A;
      object-fit: cover;
      flex-shrink: 0;
    }
    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title-wrap h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      color: #0F172A;
    }
    .pro-badge {
      background: #FACC15;
      color: #0F172A;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 8px;
      border: 2.5px solid #0F172A;
      box-shadow: 2.5px 2.5px 0px #0F172A;
      letter-spacing: 0.5px;
    }

    /* Headline & Subtitle */
    .hero-subhead {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1E293B;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .hero-desc {
      font-size: 13.5px;
      color: #475569;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    /* Feature Badges 2x2 Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
      max-width: 440px;
    }
    .feature-chip {
      background: #FFFFFF;
      border: 2.5px solid #0F172A;
      box-shadow: 3px 3px 0px #0F172A;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #0F172A;
      font-family: 'Space Grotesk', sans-serif;
    }
    .feature-chip.chip-periwinkle { background: #EEF2FF; }
    .feature-chip.chip-peach { background: #FFF1F2; }
    .feature-chip.chip-mint { background: #F0FDF4; }
    .feature-chip.chip-aqua { background: #F0F9FF; }

    .feature-chip svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Bottom Trust Statement */
    .trust-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border: 2px solid #0F172A;
      box-shadow: 2.5px 2.5px 0px #0F172A;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      color: #047857;
      width: fit-content;
    }
    .trust-row svg {
      width: 14px;
      height: 14px;
    }

    /* RIGHT VISUAL COMPOSITION */
    .showcase-right {
      position: relative;
      z-index: 10;
      width: 500px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* Smartphone Mockup - Shifted a bit right */
    .phone-wrapper {
      position: absolute;
      left: 55px;
      bottom: -40px;
      width: 215px;
      height: 460px;
      background: #0F172A;
      border-radius: 36px;
      border: 3.5px solid #0F172A;
      box-shadow: 8px 12px 0px #0F172A;
      overflow: hidden;
      transform: rotate(-3.5deg);
      z-index: 12;
    }
    .phone-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 55px;
      height: 13px;
      background: #0F172A;
      border-radius: 8px;
      z-index: 20;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      background: #FFFFFF;
      display: block;
    }

    /* 3D MASCOT (STANDALONE WITH DELTRIX HOODIE & PEDESTAL) */
    .mascot-3d {
      position: absolute;
      right: -10px;
      bottom: -15px;
      width: 295px;
      height: 385px;
      object-fit: contain;
      z-index: 15;
      filter: drop-shadow(0 14px 20px rgba(15, 23, 42, 0.18));
      pointer-events: none;
    }

    /* 3D HANGING RETRO CAMERA - Shifted further right in tandem with phone */
    .hanging-camera-3d {
      position: absolute;
      top: -28px;
      left: 232px;
      width: 125px;
      height: 145px;
      object-fit: contain;
      z-index: 18;
      filter: drop-shadow(0 8px 14px rgba(15, 23, 42, 0.15));
      transform: rotate(-3deg);
      pointer-events: none;
    }

    /* 3D SCISSORS - Floating on Left of Phone */
    .scissors-3d {
      position: absolute;
      top: 35px;
      left: -15px;
      width: 95px;
      height: 95px;
      object-fit: contain;
      z-index: 16;
      filter: drop-shadow(0 8px 12px rgba(15, 23, 42, 0.15));
      transform: rotate(20deg);
      pointer-events: none;
    }

    /* 3D PERFECT POLAROIDS - Lowered down in negative space */
    .polaroids-3d {
      position: absolute;
      left: -65px;
      bottom: 12px;
      width: 165px;
      height: auto;
      object-fit: contain;
      z-index: 18;
      filter: drop-shadow(0 10px 16px rgba(15, 23, 42, 0.22));
      transform: rotate(-6deg);
      pointer-events: none;
    }

    /* 3D LIGHTNING BOLT - Floating Top Right, shifted down and right */
    .lightning-3d {
      position: absolute;
      top: 48px;
      right: -2px;
      width: 85px;
      height: 85px;
      object-fit: contain;
      z-index: 17;
      filter: drop-shadow(0 8px 12px rgba(245, 158, 11, 0.28));
      transform: rotate(10deg);
      pointer-events: none;
    }

    /* Floating Offline Badge */
    .floating-offline-badge {
      position: absolute;
      bottom: 25px;
      right: 25px;
      background: #FACC15;
      border: 2.5px solid #0F172A;
      box-shadow: 3.5px 3.5px 0px #0F172A;
      border-radius: 999px;
      padding: 6px 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      color: #0F172A;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 22;
      transform: rotate(3deg);
    }
  </style>
</head>
<body>

  <!-- Dot background & studio ambient glow -->
  <div class="bg-dots"></div>
  <div class="glow-cyan"></div>
  <div class="glow-lavender"></div>
  <div class="glow-amber"></div>

  <!-- Sparkle Accents -->
  <div class="sparkle sp-1">✦</div>
  <div class="sparkle sp-2">★</div>

  <!-- LEFT SECTION: BRAND & VALUE PROP -->
  <div class="content-left">
    <!-- Top Studio Pill -->
    <div class="creator-pill">
      <div class="live-indicator"></div>
      <span>DELTRIX STUDIO</span>
      <span class="divider">•</span>
      <span>100% OFFLINE</span>
    </div>

    <!-- Brand Header -->
    <div class="brand-row">
      <img src="app_icon_512.png" alt="PicsTools App Icon" class="app-icon">
      <div class="brand-title-wrap">
        <h1>PicsTools</h1>
        <div class="pro-badge">PRO</div>
      </div>
    </div>

    <!-- Subtitles -->
    <h2 class="hero-subhead">Your Complete On-Device Studio</h2>
    <p class="hero-desc">Fast, private photo editing & conversion with zero cloud tracking.</p>

    <!-- 2x2 Feature Chips with SVGs -->
    <div class="features-grid">
      <div class="feature-chip chip-periwinkle">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Target KB Compress</span>
      </div>

      <div class="feature-chip chip-peach">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"></circle>
          <circle cx="6" cy="18" r="3"></circle>
          <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
          <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
          <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
        </svg>
        <span>AI Background Cutout</span>
      </div>

      <div class="feature-chip chip-mint">
        <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Photos to PDF</span>
      </div>

      <div class="feature-chip chip-aqua">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span>Passport 300 DPI</span>
      </div>
    </div>

    <!-- Bottom Trust Statement -->
    <div class="trust-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <path d="M9 12l2 2 4-4"></path>
      </svg>
      <span>100% On-Device • No Sign-In • Zero Tracking</span>
    </div>
  </div>

  <!-- RIGHT SECTION: 3D HERO COMPOSITION WITH HARMONIOUS BREATHING ROOM -->
  <div class="showcase-right">
    <!-- 3D Hanging Retro Camera (tied to rope, at top) -->
    <img src="hanging_camera_clean.png" alt="3D Camera" class="hanging-camera-3d">

    <!-- 3D Scissors (floating top-left of phone) -->
    <img src="3d_scissors_clean.png" alt="3D Scissors" class="scissors-3d">

    <!-- 3D Lightning Bolt (floating top-right near wand) -->
    <img src="3d_lightning_clean.png" alt="3D Lightning" class="lightning-3d">

    <!-- Clean Smartphone Mockup (unobstructed UI) -->
    <div class="phone-wrapper">
      <div class="phone-notch"></div>
      <img src="user_home_screen_clean.png" alt="PicsTools App Screen" class="phone-screen">
    </div>

    <!-- 3D Robot Mascot (Standalone DELTRIX hoodie, camera & wand, on pedestal) -->
    <img src="mascot_standalone_deltrix.png" alt="Deltrix 3D Mascot" class="mascot-3d">

    <!-- 3D Perfect Cutout Polaroid Frames with Human & Scenic Photos -->
    <img src="3d_polaroids_human_scenic.png" alt="3D Polaroid Photos" class="polaroids-3d">

    <!-- Floating Offline Badge -->
    <div class="floating-offline-badge">
      <span>⚡ 100% OFFLINE</span>
    </div>
  </div>

</body>
</html>
