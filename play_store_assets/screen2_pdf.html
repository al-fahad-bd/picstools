<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0B1120;
      font-family: 'Inter', sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 70px;
      color: #F8FAFC;
    }
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 1;
    }
    .ambient-glow {
      position: absolute;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 2;
    }
    .glow-top {
      top: -150px;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.2) 0%, transparent 70%);
    }

    .header-content {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-bottom: 70px;
      width: 100%;
    }
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      background: #38BDF8;
      color: #0F172A;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 900;
      border-radius: 12px;
      border: 3px solid #0F172A;
      box-shadow: 4px 4px 0px #0F172A;
      margin-bottom: 28px;
    }
    .main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -2px;
      color: #FFFFFF;
      margin-bottom: 20px;
    }
    .main-title span { color: #FACC15; }
    .subtitle {
      font-size: 28px;
      color: #94A3B8;
      font-weight: 600;
      max-width: 850px;
      margin: 0 auto;
      line-height: 1.4;
    }

    .phone-container {
      position: relative;
      z-index: 10;
      width: 820px;
      height: 1200px;
      background: #131E33;
      border: 6px solid #334155;
      border-bottom: none;
      border-radius: 54px 54px 0 0;
      box-shadow: 0 -20px 60px rgba(0,0,0,0.8), 12px 12px 0px #EAB308;
      padding: 30px 30px 0 30px;
      display: flex;
      flex-direction: column;
    }
    .phone-notch {
      width: 220px;
      height: 28px;
      background: #0B1120;
      border-radius: 14px;
      margin: 0 auto 30px auto;
    }
    .phone-screen {
      background: #0F172A;
      border: 3px solid #1E293B;
      border-bottom: none;
      border-radius: 36px 36px 0 0;
      flex: 1;
      padding: 36px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .screen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 2.5px solid #1E293B;
    }
    .screen-app-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #F8FAFC;
    }
    .preset-tag {
      background: #1E293B;
      border: 2px solid #334155;
      color: #FACC15;
      font-size: 18px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 10px;
    }

    .doc-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 10px;
    }
    .doc-page {
      background: #1E293B;
      border: 3px solid #38BDF8;
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 4px 4px 0px #0284C7;
    }
    .page-icon { font-size: 40px; margin-bottom: 8px; }
    .page-name { font-size: 18px; font-weight: 800; color: #F1F5F9; }
    .page-sub { font-size: 14px; color: #94A3B8; margin-top: 4px; }

    .pdf-meta-box {
      background: #131E33;
      border: 2.5px solid #334155;
      border-radius: 18px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meta-title { font-size: 22px; font-weight: 800; color: #F8FAFC; }
    .meta-size { font-size: 22px; font-weight: 800; color: #10B981; }

    .action-btn-large {
      background: #38BDF8;
      color: #0F172A;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      padding: 24px;
      border-radius: 20px;
      border: 4px solid #0F172A;
      box-shadow: 6px 6px 0px #0F172A;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="grid-pattern"></div>
  <div class="ambient-glow glow-top"></div>

  <div class="header-content">
    <div class="pill-badge">📄 MULTI-PAGE COMPILER</div>
    <div class="main-title">Fast Photo to <span>PDF Maker</span></div>
    <div class="subtitle">Bundle photos, receipts, certificates & notes into structured multi-page PDF documents.</div>
  </div>

  <div class="phone-container">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div class="screen-header">
        <div class="screen-app-name">Image to PDF</div>
        <div class="preset-tag">A4 STANDARD</div>
      </div>

      <div class="doc-grid">
        <div class="doc-page">
          <div class="page-icon">📸</div>
          <div class="page-name">Page 1</div>
          <div class="page-sub">Receipt #104</div>
        </div>
        <div class="doc-page">
          <div class="page-icon">📄</div>
          <div class="page-name">Page 2</div>
          <div class="page-sub">Certificate</div>
        </div>
        <div class="doc-page">
          <div class="page-icon">✍️</div>
          <div class="page-name">Page 3</div>
          <div class="page-sub">Signed Form</div>
        </div>
      </div>

      <div class="pdf-meta-box">
        <div class="meta-title">3 Pages Ready to Compile</div>
        <div class="meta-size">Output: 420 KB</div>
      </div>

      <div class="action-btn-large">
        ⚡ GENERATE CLEAN PDF
      </div>
    </div>
  </div>
</body>
</html>
