name: picstools
description: "A production-ready Flutter mobile application for an image utility app."
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  equatable: ^2.0.7
  go_router: ^14.8.0
  image_picker: ^1.1.2
  image: ^4.3.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.3.5
  google_fonts: ^6.2.1
  intl: ^0.20.2
  path: ^1.9.0
  pdf: ^3.11.1
  printing: ^5.15.0
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  gal: ^2.3.3
  dio: ^5.11.0
  crypto: ^3.0.7
  flutter_onnxruntime: ^1.8.3
  in_app_purchase: ^3.3.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/images/
    - assets/models/
    - assets/audio/
